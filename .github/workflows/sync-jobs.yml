name: Sync public internships

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: intern-finder-job-sync
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.freshness.outputs.should_run }}
    steps:
      - name: Check whether the catalog needs refreshing
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! CATALOG=$(curl --fail --silent --show-error --max-time 20 \
            'https://intern.minkoi.org/api/catalog/recommendations?limit=1&catalog=live'); then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHOULD_RUN=$(printf '%s' "$CATALOG" | python3 -c '
          import datetime, json, sys
          try:
              data = json.load(sys.stdin)
              item = data.get("items", [{}])[0]
              stamp = item.get("opportunity", {}).get("last_verified_at")
              verified = datetime.datetime.fromisoformat(stamp.replace("Z", "+00:00"))
              age = datetime.datetime.now(datetime.timezone.utc) - verified
              print("true" if age >= datetime.timedelta(minutes=55) else "false")
          except (IndexError, AttributeError, TypeError, ValueError):
              print("true")
          ')
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

  sync:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source:
          - greenhouse:cloudflare
          - greenhouse:datadog
          - greenhouse:stripe
          - greenhouse:airbnb
          - lever:field-ai
          - lever:immuta
          - lever:crestoperations
          - greenhouse:schonfeld
          - greenhouse:kodiaksolutions
          - greenhouse:precisionaq
          - greenhouse:oklo
          - greenhouse:kyowakirinusa90
          - greenhouse:farmersmutualhailinsurancecompany
          - greenhouse:acluinternships
          - greenhouse:nationallifeinsurancecompany
    steps:
      - name: Request signed job identity and refresh a source
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          TOKEN_RESPONSE=$(curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fintern.minkoi.org%2Fapi%2Fingest%2Fjobs")
          OIDC_TOKEN=$(printf '%s' "$TOKEN_RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "https://intern.minkoi.org/api/ingest/jobs?source=${SOURCE}"
